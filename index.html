<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お手紙印刷</title>
<link rel="icon" type="image/svg+xml" href="icon.svg?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="お手紙印刷">
<meta name="theme-color" content="#FBF8F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 画面: 左に貼り付け欄、右にA4の紙のプレビュー。印刷時は紙だけを出す */
:root {
  --bg: #FBF8F2;
  --panel: #ffffff;
  --ink: #2e2420;
  --muted: #75665e;
  --line: #e2d8cc;
  --accent: #6b4834;
  --accent-ink: #ffffff;
  --warn-bg: #fff1ec;
  --warn-ink: #a1381a;
  --paper: #ffffff;
  --paper-ink: #2e2420;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  --font-head: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1815; --panel: #27211d; --ink: #efe7df; --muted: #b3a498; --line: #3d332c;
    --accent: #c9a58e; --accent-ink: #1c1815; --warn-bg: #3a2119; --warn-ink: #ffb59e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1815; --panel: #27211d; --ink: #efe7df; --muted: #b3a498; --line: #3d332c;
  --accent: #c9a58e; --accent-ink: #1c1815; --warn-bg: #3a2119; --warn-ink: #ffb59e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  -webkit-text-size-adjust: 100%;
}
.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
  gap: 20px;
  min-height: 100%;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (max-width: 820px) { .app { grid-template-columns: minmax(0, 1fr); } }

/* 左: 操作 */
.control { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.control h1 {
  font-family: var(--font-head);
  font-size: 22px; margin: 0; letter-spacing: 0.04em;
}
.control .lead { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
textarea, input[type="date"] {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px;
}
textarea { width: 100%; min-height: 46vh; padding: 12px; line-height: 1.7; resize: vertical; }
input[type="date"] { padding: 8px 10px; min-height: 44px; }
textarea:focus-visible, input:focus-visible, button:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
button {
  font: inherit; font-weight: 700; min-height: 48px; padding: 0 18px;
  border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); cursor: pointer;
}
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); flex: 1; font-size: 17px; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.warn {
  background: var(--warn-bg); color: var(--warn-ink);
  border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.6;
}
.note { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 0; }

/* 右: A4の紙 */
.stage { min-width: 0; display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
.sheet {
  width: 210mm; min-height: 297mm; max-width: 100%;
  background: var(--paper); color: var(--paper-ink);
  padding: 18mm 18mm 16mm;
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.08);
  display: flex; flex-direction: column;
  font-size: 11.5pt; line-height: 1.85;
}
.sheet .masthead {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  border-bottom: 3px solid #6fb82b; padding-bottom: 6px;
}
.sheet .clinic { font-family: var(--font-head); font-weight: 700; font-size: 13pt; color: #6b4834; letter-spacing: 0.06em; }
.sheet .date { font-size: 10.5pt; color: #4b5753; font-variant-numeric: tabular-nums; }
.sheet .title { font-family: var(--font-head); font-size: 19pt; font-weight: 700; margin: 9mm 0 1mm; letter-spacing: 0.04em; text-wrap: balance; }
.sheet .to { margin: 0 0 6mm; font-size: 12pt; }
.sheet .body { flex: 1; }
.sheet h2 {
  font-family: var(--font-head); font-size: 12.5pt; font-weight: 700;
  margin: 6mm 0 1.5mm; padding-bottom: 1mm; border-bottom: 1px solid #e2d8cc;
}
.sheet h2:first-child { margin-top: 0; }
.sheet p { margin: 0; }
.sheet .check { background: #ffe1d6; color: #a1381a; font-weight: 700; padding: 0 3px; border-radius: 3px; }
.sheet .footer {
  margin-top: 10mm; padding-top: 3mm; border-top: 1px solid #e2d8cc;
  font-size: 10pt; color: #4b5753; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.sheet .footer strong { font-family: var(--font-head); color: #6b4834; font-size: 11pt; }
.sheet .empty { color: #8a958f; }

@page { size: A4; margin: 0; }
@media print {
  body { background: #fff; }
  .control { display: none !important; }
  .app { display: block; padding: 0; }
  .stage { display: block; overflow: visible; }
  .sheet { box-shadow: none; width: 210mm; min-height: 297mm; max-width: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <section class="control" aria-label="操作">
    <h1>お手紙印刷</h1>
    <p class="lead">ChatGPTの「出力2：飼い主さんへのまとめ」を貼り付けると、右に印刷する紙の形で表示されます。直したいところは、この欄でそのまま直してください。</p>

    <div class="field">
      <label for="src">まとめの文章</label>
      <textarea id="src" spellcheck="false"></textarea>
    </div>

    <div class="row">
      <div class="field">
        <label for="day">日付</label>
        <input type="date" id="day">
      </div>
      <button type="button" id="pasteBtn">貼り付け</button>
      <button type="button" id="clearBtn">消す</button>
    </div>

    <div class="warn" id="warn" hidden></div>

    <div class="row">
      <button type="button" class="primary" id="printBtn">印刷する</button>
    </div>
    <p class="note">文章はこのページにだけ表示され、どこにも保存・送信されません。ページを閉じると消えます。<br>渡す前に、受付で【お薬】の欄を会計明細・薬袋と見比べてください。</p>
  </section>

  <section class="stage" aria-label="印刷プレビュー">
    <article class="sheet" id="sheet">
      <header class="masthead">
        <span class="clinic">にゅうた動物病院</span>
        <span class="date" id="outDate"></span>
      </header>
      <div class="title" id="outTitle">本日の診察のまとめ</div>
      <p class="to" id="outTo" hidden></p>
      <div class="body" id="outBody"></div>
      <footer class="footer">
        <span>ご不明な点やご心配なことがあれば、お気軽に病院までご連絡ください。</span>
        <strong>にゅうた動物病院</strong>
      </footer>
    </article>
  </section>
</div>

<script>
(function () {
  var src = document.getElementById('src');
  var day = document.getElementById('day');
  var warn = document.getElementById('warn');
  var printBtn = document.getElementById('printBtn');
  var outDate = document.getElementById('outDate');
  var outTitle = document.getElementById('outTitle');
  var outTo = document.getElementById('outTo');
  var outBody = document.getElementById('outBody');

  var SAMPLE = [
    '（見本です。ここにChatGPTの出力2を貼り付けてください）',
    '本日の診察のまとめ',
    '（ミケちゃんの飼い主様へ）',
    '',
    '【今日わかったこと】',
    '血液検査で、腎臓の働きを表す数値が上がっていました。',
    'エコー検査では、胃腸の動きが少し弱くなっていました。',
    '',
    '【お薬】',
    '吐き気止めと、胃腸の動きを助けるお薬をお出ししています。',
    '飲ませる量・回数・日数：【要確認】',
    '',
    '【次回の予定】',
    '1週間後に来院してください。血液検査で腎臓の数値をもう一度確認します。',
    '',
    'にゅうた動物病院'
  ].join('\n');

  function today() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + dd;
  }
  function jpDate(v) {
    if (!v) return '';
    var p = v.split('-');
    return p[0] + '年' + Number(p[1]) + '月' + Number(p[2]) + '日';
  }
  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function inline(s) {
    return esc(s).replace(/【要確認】/g, '<span class="check">【要確認】</span>');
  }

  function render() {
    outDate.textContent = jpDate(day.value);
    var lines = src.value.replace(/\r/g, '').split('\n');
    var title = '本日の診察のまとめ';
    var to = '';
    var html = [];
    var para = [];
    function flush() {
      if (para.length) { html.push('<p>' + para.join('<br>') + '</p>'); para = []; }
    }
    lines.forEach(function (raw) {
      var line = raw.trim();
      if (/^```/.test(line)) return;                        // コードブロックの記号
      if (/^出力[12][：:]/.test(line)) return;               // 「出力2：…」の行
      if (/^（見本です/.test(line)) return;
      if (line === 'にゅうた動物病院') return;               // 紙の下に入れるので省く
      if (line === '本日の診察のまとめ' || line === '検査結果のご説明') { title = line; return; }
      if (/^[（(].*飼い主様へ[）)]$/.test(line)) { to = line.replace(/^[（(]|[）)]$/g, ''); return; }
      var h = line.match(/^【(.+)】$/);
      if (h && h[1] !== '要確認') { flush(); html.push('<h2>' + esc(h[1]) + '</h2>'); return; }
      if (line === '') { flush(); return; }
      para.push(inline(line));
    });
    flush();

    outTitle.textContent = title;
    outTo.hidden = !to;
    outTo.textContent = to;
    outBody.innerHTML = html.length ? html.join('') : '<p class="empty">ここに文章が表示されます。</p>';

    var checks = (src.value.match(/【要確認】/g) || []).length;
    var empty = !html.length;
    if (checks) {
      warn.hidden = false;
      warn.textContent = '【要確認】が' + checks + 'か所残っています。担当の先生に確認して直してから印刷してください。';
    } else {
      warn.hidden = true;
    }
    printBtn.disabled = checks > 0 || empty;
  }

  document.getElementById('pasteBtn').addEventListener('click', function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) { src.focus(); return; }
    navigator.clipboard.readText().then(function (t) {
      if (t) { src.value = t; render(); }
    }).catch(function () { src.focus(); });
  });
  document.getElementById('clearBtn').addEventListener('click', function () {
    src.value = ''; day.value = today(); render(); src.focus();
  });
  printBtn.addEventListener('click', function () { window.print(); });
  // 長押しの「ペースト」で貼った時も、まとめ全体なら前の文章(見本など)を置き換える
  src.addEventListener('paste', function (e) {
    var t = (e.clipboardData || window.clipboardData).getData('text');
    if (t && (/本日の診察のまとめ/.test(t) || /【.+】/.test(t))) {
      e.preventDefault();
      src.value = t;
      render();
    }
  });
  src.addEventListener('input', render);
  day.addEventListener('input', render);

  day.value = today();
  src.value = SAMPLE;
  render();
})();
</script>
</body>
</html>
